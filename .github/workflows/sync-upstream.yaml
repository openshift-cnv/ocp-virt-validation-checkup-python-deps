name: Sync upstream dependencies

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Init and update submodule
        run: |
          git submodule init
          git submodule update
          git submodule update --remote upstream/openshift-virtualization-tests

      - name: Export requirements.txt from uv.lock
        working-directory: upstream/openshift-virtualization-tests
        run: uv export --format requirements.txt --frozen --no-dev --output-file ../../requirements.txt

      - name: Filter out problematic packages
        run: |
          # Remove Windows-only packages (no Linux distributions)
          sed -i '/^colorama==/,/^[^ ]/{ /^colorama==/d; /^    /d; /^$/d; }' requirements.txt
          sed -i '/^pywin32==/,/^[^ ]/{ /^pywin32==/d; /^    /d; /^$/d; }' requirements.txt
          # Remove the editable install line (project installed via .pth file)
          sed -i '/^-e \./d' requirements.txt

      - name: Download packages
        run: |
          rm -rf deps && mkdir -p deps
          PYTHON314=$(uv python find 3.14)

          # Download packages for x86_64 (runner native, gets best wheels + sdist fallback)
          $PYTHON314 -m pip download -r requirements.txt --dest deps/ \
            --no-deps --prefer-binary

          # Extract plain package==version list for cross-platform downloads
          grep -E '^[a-zA-Z]' requirements.txt | sed 's/ .*//' > reqs-plain.txt
          echo "Packages for cross-platform download: $(wc -l < reqs-plain.txt)"

          # Download aarch64 and s390x wheels for packages with native extensions
          for platform in manylinux2014_aarch64 manylinux_2_28_aarch64 manylinux_2_34_aarch64 \
                          manylinux2014_s390x manylinux_2_28_s390x manylinux_2_34_s390x; do
            echo "Downloading for platform: $platform"
            $PYTHON314 -m pip download -r reqs-plain.txt --dest deps/ \
              --no-deps --only-binary :all: --platform $platform || true
          done
          rm -f reqs-plain.txt

          # Download build backends (pure Python, needed for sdist-only packages)
          $PYTHON314 -m pip download --dest deps/ --no-deps --prefer-binary \
            hatchling editables pathspec trove-classifiers hatch-vcs \
            hatch-fancy-pypi-readme flit_core wheel setuptools \
            poetry-core poetry-dynamic-versioning dunamai tomlkit \
            setuptools-rust semantic-version setuptools-scm \
            calver vcs-versioning tomli pbr pytest-runner

          # maturin needs platform-specific wheels for all arches
          for platform in manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64 \
                          manylinux_2_17_s390x.manylinux2014_s390x; do
            $PYTHON314 -m pip download --dest deps/ --no-deps --only-binary :all: \
              maturin --platform $platform 2>/dev/null || true
          done

          echo "Downloaded $(ls deps/ | wc -l) package files"

      - name: Check for changes
        id: check
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          UPSTREAM_SHA=$(git -C upstream/openshift-virtualization-tests rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync deps from openshift-virtualization-tests ${UPSTREAM_SHA}"
          git push
