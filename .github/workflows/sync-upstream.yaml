name: Sync upstream dependencies

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Init and update submodule
        run: |
          git submodule init
          git submodule update
          git submodule update --remote upstream/openshift-virtualization-tests

      - name: Export requirements.txt from uv.lock
        working-directory: upstream/openshift-virtualization-tests
        run: uv export --format requirements.txt --frozen --no-dev --output-file ../../requirements-new.txt

      - name: Filter and clean requirements.txt
        run: |
          # Remove Windows-only packages (no Linux distributions)
          sed -i '/^colorama==/,/^[^ ]/{ /^colorama==/d; /^    /d; /^$/d; }' requirements-new.txt
          sed -i '/^pywin32==/,/^[^ ]/{ /^pywin32==/d; /^    /d; /^$/d; }' requirements-new.txt
          # Remove the editable install line (project installed via .pth file)
          sed -i '/^-e \./d' requirements-new.txt
          # Strip hashes (QEMU-built wheels have different hashes than PyPI)
          grep -E '^[a-zA-Z]' requirements-new.txt | sed 's/ .*//' > requirements-clean.txt
          mv requirements-clean.txt requirements-new.txt

      - name: Check if dependencies changed
        id: deps-check
        run: |
          if [ -f requirements.txt ] && diff -q requirements.txt requirements-new.txt > /dev/null 2>&1; then
            echo "deps_changed=false" >> $GITHUB_OUTPUT
            echo "Dependencies unchanged -- skipping download and QEMU build"
            rm requirements-new.txt
          else
            echo "deps_changed=true" >> $GITHUB_OUTPUT
            mv requirements-new.txt requirements.txt
            if [ -f requirements.txt ]; then
              echo "Dependencies changed -- full rebuild required"
            else
              echo "First run -- full build required"
            fi
          fi

      - name: Download packages
        if: steps.deps-check.outputs.deps_changed == 'true'
        run: |
          rm -rf deps && mkdir -p deps
          PYTHON314=$(uv python find 3.14)

          # Download packages for x86_64 (runner native, gets best wheels + sdist fallback)
          $PYTHON314 -m pip download -r requirements.txt --dest deps/ \
            --no-deps --prefer-binary

          # Extract plain package==version list for cross-platform downloads
          grep -E '^[a-zA-Z]' requirements.txt | sed 's/ .*//' > reqs-plain.txt
          echo "Packages for cross-platform download: $(wc -l < reqs-plain.txt)"

          # Download sdists for native packages (fallback for arches without wheels)
          NATIVE_PKGS="bcrypt cachebox caio cffi charset-normalizer cryptography greenlet markupsafe psutil pydantic-core pynacl rpds-py ruff sqlalchemy tomli watchfiles websockets pyyaml"
          for pkg in $NATIVE_PKGS; do
            ver=$(grep "^${pkg}==" reqs-plain.txt | head -1)
            [ -z "$ver" ] && continue
            $PYTHON314 -m pip download --dest deps/ --no-deps --no-binary :all: "$ver" 2>/dev/null || true
          done
          for arch in aarch64 s390x; do
            echo "Downloading $arch wheels for native packages..."
            tmpdir=$(mktemp -d)
            for pkg in $NATIVE_PKGS; do
              ver=$(grep "^${pkg}==" reqs-plain.txt | head -1)
              [ -z "$ver" ] && continue
              for platform in manylinux_2_17_${arch} manylinux_2_28_${arch} manylinux_2_34_${arch}; do
                $PYTHON314 -m pip download \
                  --dest "$tmpdir" --no-deps --only-binary :all: \
                  --platform $platform --python-version 3.14 --abi cp314 --abi abi3 --abi none \
                  "$ver" 2>/dev/null && break
              done
            done
            echo "  Downloaded for $arch: $(ls $tmpdir/*.whl 2>/dev/null | wc -l) wheels"
            cp -n "$tmpdir"/*.whl deps/ 2>/dev/null || true
            rm -rf "$tmpdir"
          done
          rm -f reqs-plain.txt

          # Download build backends (pure Python, needed for sdist-only packages)
          $PYTHON314 -m pip download --dest deps/ --no-deps --prefer-binary \
            hatchling editables pathspec trove-classifiers hatch-vcs \
            hatch-fancy-pypi-readme flit_core wheel setuptools \
            poetry-core poetry-dynamic-versioning dunamai tomlkit \
            setuptools-rust semantic-version setuptools-scm \
            calver vcs-versioning tomli pbr pytest-runner

          # maturin needs platform-specific wheels for all arches
          for platform in manylinux2010_x86_64 manylinux2014_aarch64 manylinux2014_s390x; do
            tmpdir=$(mktemp -d)
            $PYTHON314 -m pip download --dest "$tmpdir" --no-deps --only-binary :all: \
              maturin --platform $platform || true
            ls "$tmpdir"/*.whl 2>/dev/null && cp "$tmpdir"/*.whl deps/
            rm -rf "$tmpdir"
          done

          echo "Downloaded $(ls deps/ | wc -l) package files"

      - name: Set up QEMU for s390x
        if: steps.deps-check.outputs.deps_changed == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x

      - name: Build s390x wheels for packages without PyPI wheels
        if: steps.deps-check.outputs.deps_changed == 'true'
        run: |
          # Packages that need s390x wheels built (no PyPI wheels available)
          S390X_BUILD="bcrypt caio cryptography markupsafe psutil pynacl sqlalchemy tomli"
          REQS=""
          for pkg in $S390X_BUILD; do
            ver=$(grep -oE "^${pkg}==[0-9.]+" requirements.txt | head -1)
            [ -n "$ver" ] && REQS="$REQS $ver"
          done
          echo "Building s390x wheels for: $REQS"

          docker run --rm --platform linux/s390x \
            -v "$PWD/deps:/deps" \
            -v "$PWD/requirements.txt:/requirements.txt" \
            python:3.14 bash -c "
              apt-get update && apt-get install -y cargo rustc libffi-dev libssl-dev &&
              pip install --upgrade pip wheel setuptools setuptools-rust maturin &&
              pip wheel --no-deps --wheel-dir /deps $REQS
            "

          echo "After s390x build: $(ls deps/ | wc -l) package files"

      - name: Check for changes
        id: check
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          UPSTREAM_SHA=$(git -C upstream/openshift-virtualization-tests rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync deps from openshift-virtualization-tests ${UPSTREAM_SHA}"
          git push
