name: Sync upstream dependencies

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Init and update submodule
        run: |
          git submodule init
          git submodule update
          git submodule update --remote upstream/openshift-virtualization-tests

      - name: Export requirements.txt from uv.lock
        working-directory: upstream/openshift-virtualization-tests
        run: uv export --format requirements.txt --frozen --no-dev --output-file ../../requirements.txt

      - name: Filter out problematic packages
        run: |
          # Remove Windows-only packages (no Linux distributions)
          sed -i '/^colorama==/,/^[^ ]/{ /^colorama==/d; /^    /d; /^$/d; }' requirements.txt
          sed -i '/^pywin32==/,/^[^ ]/{ /^pywin32==/d; /^    /d; /^$/d; }' requirements.txt
          # Remove the editable install line (project installed via .pth file)
          sed -i '/^-e \./d' requirements.txt

      - name: Download packages
        run: |
          rm -rf deps && mkdir -p deps

          # Strip hashes from requirements.txt for cross-version download
          sed 's/ \\$//' requirements.txt | grep -v '^\s*--hash' | grep -v '^\s*#' | grep -v '^\s*$' > requirements-nohash.txt

          # Download Python 3.14 manylinux wheels for all target architectures
          for platform in manylinux2014_x86_64 manylinux2014_aarch64 manylinux2014_s390x; do
            pip download -r requirements-nohash.txt --dest deps/ --no-deps \
              --only-binary :all: --python-version 314 --implementation cp \
              --abi cp314 --abi abi3 --abi none \
              --platform ${platform} --platform linux 2>/dev/null || true
          done

          # Download sdists for packages that don't have wheels
          pip download -r requirements-nohash.txt --dest deps/ --no-deps --no-binary :all: 2>/dev/null || true

          # Download build backends (pure Python wheels, no version constraint)
          pip download --dest deps/ --no-deps --prefer-binary \
            hatchling editables pathspec trove-classifiers hatch-vcs \
            hatch-fancy-pypi-readme flit_core wheel setuptools \
            poetry-core poetry-dynamic-versioning dunamai tomlkit \
            setuptools-rust semantic-version setuptools-scm \
            calver vcs-versioning tomli pbr pytest-runner

          # maturin has platform-specific wheels
          for platform in manylinux2010_x86_64.musllinux_1_1_x86_64 manylinux2014_aarch64.musllinux_1_1_aarch64 manylinux2014_s390x; do
            pip download --dest deps/ --no-deps --only-binary :all: maturin \
              --platform ${platform} 2>/dev/null || true
          done

          rm -f requirements-nohash.txt
          echo "Downloaded $(ls deps/ | wc -l) package files"

      - name: Check for changes
        id: check
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          UPSTREAM_SHA=$(git -C upstream/openshift-virtualization-tests rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync deps from openshift-virtualization-tests ${UPSTREAM_SHA}"
          git push
